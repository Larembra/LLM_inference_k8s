apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 0
        fsGroup: 0
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
      initContainers:
        - name: download-model
          image: llm-model-loader:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: inference-config
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: inference-secrets
                  key: hf-token
                  optional: true
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: models
              mountPath: /models
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: vllm
          image: llm-inference:local
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - $(MODEL_PATH)
            - --served-model-name
            - $(MODEL_ID)
            - --dtype
            - bfloat16
            - --max-model-len
            - $(MAX_MODEL_LEN)
            - --max-num-seqs
            - $(MAX_NUM_SEQS)
            - --gpu-memory-utilization
            - "0.35"
            - --api-key
            - $(API_TOKEN)
          envFrom:
            - configMapRef:
                name: inference-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: inference-secrets
                  key: api-token
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: models
              mountPath: /models
              readOnly: true
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "6"
              memory: 16Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llm-inference
spec:
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
