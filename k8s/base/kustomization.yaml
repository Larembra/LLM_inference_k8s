apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-inference
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

# Хэш в имени ConfigMap => любое изменение inference.env само пересоздаёт под
configMapGenerator:
  - name: inference-config
    envs:
      - inference.env

# Тег меняйте при каждой пересборке: с IfNotPresent кластер молча берёт старый образ
images:
  - name: llm-inference
    newName: llm-inference
    newTag: r2
  - name: llm-model-loader
    newName: llm-model-loader
    newTag: r1