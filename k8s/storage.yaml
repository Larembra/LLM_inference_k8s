apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: llm-inference
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-config
  namespace: llm-inference
data:
  MODEL_ID: Qwen/Qwen2.5-1.5B-Instruct
  MODEL_PATH: /models/qwen
  MAX_MODEL_LEN: "512"
  MAX_NUM_SEQS: "1"
